<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LUNA | Редактор</title>
    <link rel="stylesheet" href="/styles/base.css" />
    <link rel="stylesheet" href="/styles/header.css" />
    <link rel="stylesheet" href="/styles/editor.css" />
  </head>
  <body>
    <div class="container">
      <section class="app-header-wrap" id="app-header-root"></section>

      <section class="card editor-controls">
        <div class="editor-controls-actions">
          <button
            id="editor-back"
            type="button"
            class="btn btn-secondary btn-icon"
            title="К списку презентаций"
            aria-label="К списку презентаций"
          >
            <span class="material-icons" aria-hidden="true">arrow_back</span>
          </button>
        </div>
        <!-- <p class="muted actions-title">Навигация</p> -->
      </section>

      <section class="card editor-shell">
        <header class="editor-head">
          <h1 id="editor-title">Редактор</h1>
          <p id="editor-meta" class="muted"></p>
        </header>

        <section class="editor-topbar">
          <div class="editor-topbar-left">
            <button
              id="open-block-types"
              type="button"
              class="btn btn-secondary btn-icon"
              title="Добавить блок"
              aria-label="Добавить блок"
            >
              <span class="material-icons" aria-hidden="true">add</span>
            </button>
            <div
              id="block-types-menu"
              class="block-types-menu card motion-popover"
              hidden
            ></div>
            <button id="toggle-preview-top" type="button" class="btn btn-primary">
              Лайв
            </button>
          </div>
          <p class="muted editor-topbar-hint">
            Выберите или создайте блок для настройки.
          </p>
        </section>

        <section id="editor-layout" class="editor-layout">
          <div class="editor-builder">
            <aside class="card blocks-panel">
              <h2>Блоки</h2>
              <p class="muted">Перетаскивайте блоки, чтобы менять порядок.</p>
              <ul id="editor-blocks-list" class="blocks-list"></ul>
              <p id="editor-blocks-empty" class="muted blocks-empty">
                Пока блоков нет.
              </p>
            </aside>

            <section class="card settings-panel">
              <h2 id="settings-title">Настройки блока</h2>
              <div id="editor-settings-content" class="settings-content"></div>
            </section>

            <button
              id="open-preview-side"
              type="button"
              class="btn btn-secondary preview-rail-btn"
              title="Открыть предпросмотр"
              aria-label="Открыть предпросмотр"
            >
              Предпросмотр
            </button>
          </div>

          <aside
            id="editor-preview"
            class="editor-preview card"
            aria-hidden="true"
          >
            <button
              id="close-preview-side"
              type="button"
              class="btn btn-secondary preview-back-btn"
              title="Вернуться к редактору"
              aria-label="Вернуться к редактору"
            >
              К редактору
            </button>
            <section class="preview-screen preview-tv">
              <h3>ТВ</h3>
              <div id="tv-preview-content" class="preview-content"></div>
            </section>
            <section class="preview-screen preview-guest">
              <h3>Гость</h3>
              <div id="guest-preview-content" class="preview-content"></div>
            </section>
          </aside>
        </section>

        <div id="add-block-modal" class="modal" hidden>
          <div class="modal-backdrop" data-close-add-modal></div>
          <div class="card modal-card">
            <div class="modal-head">
              <h3>Добавление блока</h3>
              <button
                id="close-add-modal"
                type="button"
                class="btn btn-secondary btn-icon"
                title="Закрыть"
                aria-label="Закрыть"
              >
                <span class="material-icons" aria-hidden="true">close</span>
              </button>
            </div>
            <form id="add-block-form" class="modal-form">
              <label class="modal-row">
                <span>Тип блока</span>
                <input
                  id="add-block-type-label"
                  class="input"
                  type="text"
                  readonly
                />
              </label>
              <label class="modal-row">
                <span>Название блока</span>
                <input
                  id="add-block-title"
                  class="input"
                  type="text"
                  maxlength="120"
                  required
                />
              </label>
              <label class="modal-row">
                <span>Описание (опционально)</span>
                <textarea
                  id="add-block-note"
                  class="input"
                  rows="3"
                  maxlength="800"
                ></textarea>
              </label>
              <button type="submit" class="btn btn-primary">
                Добавить блок
              </button>
            </form>
          </div>
        </div>
        <div id="editor-error" class="error-box" hidden></div>
      </section>
    </div>

    <script type="module" src="/scripts/editor/index.js?v=12"></script>
  </body>
</html>
