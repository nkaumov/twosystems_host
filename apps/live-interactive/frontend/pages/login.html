<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LUNA | Вход</title>
    <link rel="stylesheet" href="/styles/base.css" />
    <link rel="stylesheet" href="/styles/login.css" />
  </head>
  <body>
    <main class="login-layout">
      <section class="card login-card">
        <img
          class="login-logo"
          src="/logo.png?v=2"
          alt="Логотип LUNA"
          width="180"
          height="120"
        />
        <h1>LUNA</h1>
        <p class="muted">Войдите, чтобы управлять презентациями и лайв-сессиями.</p>
        <form id="login-form" class="login-form" autocomplete="off">
          <label class="login-row">
            <span>Логин</span>
            <input class="input" type="text" name="login" autocomplete="username" required />
          </label>
          <label class="login-row">
            <span>Пароль</span>
            <input class="input" type="password" name="password" autocomplete="current-password" required />
          </label>
          <button
            id="login-submit"
            type="submit"
            class="btn btn-primary"
            title="Войти"
            aria-label="Войти"
          >
            Войти
          </button>
        </form>
        <div id="login-error" class="error-box" hidden></div>
      </section>
    </main>
    <script type="module" src="/scripts/login/index.js?v=3"></script>
  </body>
</html>
